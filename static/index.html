<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>William</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="mascot">
    <button id="teacher-btn" class="teacher-btn" type="button">⚙</button>
    <p id="score" class="score">0/5</p>
    <p id="bubble" class="bubble"></p>
    <pre id="cat" title="Click me!"></pre>
    <p class="name">William</p>
    <button id="flip-test" class="test-btn" type="button">🐱 Salto!</button>
    <div class="menus">
      <select id="course" aria-label="Course"></select>
      <select id="lesson" aria-label="Lesson"></select>
    </div>
  </header>

  <main id="chat"></main>

  <!-- Helper buttons for the exercises -->
  <div id="helpers" class="helpers" hidden>
    <button id="hint-btn" type="button"></button>
    <button id="listen-btn" type="button"></button>
    <button id="dontknow-btn" type="button"></button>
  </div>

  <form id="form">
    <input id="input" placeholder="Write to William…" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="300">
    <button id="send">Send</button>
  </form>

  <!-- Teacher settings: filled in by chat.js -->
  <dialog id="teacher">
    <form id="teacher-form" method="dialog"></form>
  </dialog>

  <script src="chat.js"></script>
</body>
</html>
